name: "Static Analysis"

on: [push]

jobs:
  static-analysis:
    permissions:
      contents: read
      security-events: write
    uses: netsurf-browser/ci-tools/.github/workflows/static-analysis.yaml@master
    with:
      env-sh: docs/env.sh
      make-tools: true
      extra-packages: >-
        libcurl4-openssl-dev
        libgtk-3-dev
        libhtml-parser-perl
        libjpeg-dev
        libpng-dev
        librsvg2-dev
        libutf8proc-dev

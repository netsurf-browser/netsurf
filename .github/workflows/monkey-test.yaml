name: "Monkey Test"

on: [pull_request]

jobs:
  test:
    name: '${{ matrix.test }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - short-internet

    env:
      TARGET_WORKSPACE: "${{ github.workspace }}/projects"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.job }}
        max-size: 128M

    - name: Setup
      uses: netsurf-browser/ci-tools/.github/actions/setup@master
      with:
        env-sh: docs/env.sh
        make-tools: true
        extra-packages: >-
          ccache
          libcurl4-openssl-dev
          libgtk-3-dev
          libhtml-parser-perl
          libjpeg-dev
          libpng-dev
          librsvg2-dev
          libutf8proc-dev
          python3-pyasyncore
          wbritish

    - name: Disable -Werror
      # We can remove this step if we ever move to GitHub properly.
      run: |
          find . -type f -name Makefile | xargs sed -i 's/-Werror//'

    - name: Build NetSurf Monkey
      run: |
          source docs/env.sh || exit 1
          make -j"$(nproc)" TARGET=monkey

    - name: Run Monkey Test
      env:
        TEST: ${{ matrix.test }}
      run: |
          LC_ALL=C.UTF-8 test/monkey-see-monkey-do -v -d "$TEST"
